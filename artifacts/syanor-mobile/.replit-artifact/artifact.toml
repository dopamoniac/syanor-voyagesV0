kind = "mobile"
previewPath = "/mobile/"
title = "SYANOR VOYAGES Mobile"
version = "1.0.0"
id = "artifacts/syanor-mobile"
router = "expo-domain"

[[integratedSkills]]
name = "expo"
version = "1.0.0"

[[services]]
ensurePreviewReachable = "/status"
name = "expo"
paths = [ "/mobile/" ]
localPort = 20891

[services.development]
run = "pnpm --filter @workspace/syanor-mobile run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/syanor-mobile", "run", "build" ]
run = [ "pnpm", "--filter", "@workspace/syanor-mobile", "run", "serve" ]

[services.env]
PORT = "20891"
BASE_PATH = "/mobile/"
