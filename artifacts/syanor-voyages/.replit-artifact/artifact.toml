kind = "web"
previewPath = "/"
title = "SYANOR VOYAGES"
version = "1.0.0"
id = "artifacts/syanor-voyages"
router = "path"

[[integratedSkills]]
name = "react-vite"
version = "1.0.0"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 20958

[services.development]
run = "pnpm --filter @workspace/syanor-voyages run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/syanor-voyages", "run", "build" ]
publicDir = "artifacts/syanor-voyages/dist/public"
serve = "static"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "20958"
BASE_PATH = "/"
